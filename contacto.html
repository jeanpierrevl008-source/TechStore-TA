<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | TechStore</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <h1>TechStore</h1>

        <nav class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="catalogoproductos.html">Productos</a>
            <a href="contacto.html">Contacto</a>
        </nav> 
    </header>

    <main class="contenido">
        <h2>Contáctanos</h2>
        <p>Completa el siguiente formulario para comunicarte con nosotros.</p>

        <section class="ofertas">
            <h3>Formulario de contacto</h3>
            <form id="formulario">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre"
                    placeholder="Ingresa tu nombre" required>
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo"
                    placeholder="Ingresa tu correo" required>
                </div>

                <div>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto"
                    placeholder="Escribe el asunto" required>
                </div>

                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje"
                    placeholder="Escribe tu mensaje" required></textarea>
                </div>
                <br>
                <button type="submit">Enviar mensaje</button>
            </form>
            <p id="resultado" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="pie">
        <p>TechStore 2026 - Todos los derechos reservados</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
